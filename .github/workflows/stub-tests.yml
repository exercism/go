name: Stub tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Go ${{ matrix.go-version }} - ${{ matrix.os }}/${{ matrix.test-arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-26.04, windows-2025, macOS-latest]
        test-arch: [amd64]
        race: ["-race"]

        include:
          - go-version: 1.26.x
            test-arch: "386"
            os: ubuntu-26.04
            race: ""
          - go-version: 1.26.x
            test-arch: "386"
            os: windows-2025
            race: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test stubs
        shell: bash
        env:
          GOARCH: ${{ matrix.test-arch }}
        run: ./bin/run-tests test-stubs
